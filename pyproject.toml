[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qattack"
version = "0.2.0"
description = "QAttack — QuSec Communication Channel Attacker & Threat Demonstration Framework (Eve)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "QuSec Team" }]
license = { text = "MIT" }
keywords = ["quantum", "cybersecurity", "qkd", "attacker", "mitm", "esp32", "claude-code-tui", "qattack"]
dependencies = [
    "rich>=13.0.0",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
qattack = "qattack.cli:main"
qusec-attacker = "qattack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
